[project]
name = "lotus"
version = "0.8.0"

[requires]
platform = "cy2026"
profile = "core"

# The Hydra adapter needs a real OpenUSD imaging runtime (`--profile lookdev`
# or `usd`); the default `core` build stays OpenUSD-free.
[build.intents.hydra]
cache = { LOTUS_ENABLE_HYDRA2 = { type = "BOOL", value = true } }

# The standalone viewport opening USD stages through the Hydra adapter
# (`ost renderer viewport --intent viewport-usd --profile lookdev`).
[build.intents.viewport-usd]
cache = { LOTUS_ENABLE_HYDRA2 = { type = "BOOL", value = true }, LOTUS_ENABLE_VIEWPORT = { type = "BOOL", value = true } }

# The default build plus the research-tier CTests (docs/design/TEST_POLICY.md).
[build.intents.research]
cache = { LOTUS_RESEARCH_TESTS = { type = "BOOL", value = true } }

# CI proves the core and install tree on a host with no GPU SDK or runtime.
[build.intents.ci-core]
cache = { LOTUS_ENABLE_VULKAN = { type = "BOOL", value = false } }
