schema: openstrata.renderer/v1alpha1
renderer:
  name: lotus
composition:
  backend: vulkan
  scene_inputs: [headless, hydra2]
  units:
    core: lotus-render-core
    extraction: lotus-render-extraction
    backend: lotus-render-vulkan
  adapters:
    headless: lotus-headless
    hydra2: hdLotus
    viewport: lotus-viewport
render_products:
  required: [color, depth]
frame:
  # Independently reusable frame contexts; this backend has one frame in flight.
  contexts: 1
  completion: explicit
validation:
  gpu_smoke: true
  validation_messages_are_errors: true
  assertions:
    - renderer.core.boundary
    - renderer.backend.capability
    - renderer.gpu.frame
    - renderer.scene.upload
    - renderer.scene.acceleration
    - renderer.scene.timestamp
    - renderer.ray_query.capability
    - renderer.ray_query.triangle
    - renderer.ray_query.timestamp
    - renderer.path.bsdf
    - renderer.path.normals
    - renderer.path.textures
    - renderer.path.normal_maps
    - renderer.path.multibounce
    - renderer.path.accumulation
    - renderer.path.reference
    - renderer.validation.messages
    - renderer.render_product.color
    - renderer.render_product.depth
    - renderer.frame.persistence
    - renderer.aov.clears
    - renderer.install_tree
    - renderer.plugin.discovery
    - renderer.delegate.creation
    - renderer.render_buffer.cpu
    - renderer.host.first_frame
    - renderer.host.stable_update
